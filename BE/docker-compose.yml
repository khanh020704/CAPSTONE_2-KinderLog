name: kinderlog

services:
  postgres:
    image: postgres:16-alpine
    container_name: kinderlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kinderlog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kinderlog}
      POSTGRES_DB: ${DB_NAME:-kinderlog}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-kinderlog} -d ${DB_NAME:-kinderlog}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kinderlog-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional web UI for the database: http://localhost:8080 (server: postgres)
  adminer:
    image: adminer:4
    container_name: kinderlog-adminer
    profiles: ['tools']
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
