name: kinderlog

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kinderlog-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      # Must satisfy SQL Server's policy: 8+ chars with upper case, lower case, digits and symbols
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-KinderLog@2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${DB_PORT:-1433}:1433'
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: kinderlog-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mssqldata:
  redisdata:
